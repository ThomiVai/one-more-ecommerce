<!doctype html><html lang="es"><head><meta name="robots" content="noindex,nofollow"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>ONE MORE — Validación V121</title><style>body{font-family:system-ui;background:#101411;color:#f7f7f1;margin:0;padding:28px;line-height:1.5}main{max-width:1100px;margin:auto}h1{font-size:30px}p{color:#c4cabf}.tag{color:#b5ff63}table{border-collapse:collapse;width:100%;font-size:14px}td,th{padding:12px 8px;border-bottom:1px solid #343b33;text-align:left}input{padding:12px;width:min(400px,90%);background:#202820;border:1px solid #5d685b;color:white;border-radius:8px}code{color:#b5ff63}strong{color:#fff}.notice{background:#232b20;border-radius:10px;padding:16px;margin:18px 0}.muted{color:#9aa596}</style></head><body><main><div class="tag">ONE MORE / STAGING · V121</div><h1>Vista previa del catálogo administrado</h1><p>Solo lectura: esta pantalla NO cambia la tienda, el carrito ni el stock. Compara el catálogo comercial con las modificaciones de D1.</p><div class="notice" id="status">Cargando datos de D1…</div><label>Buscar <input id="q" placeholder="Marca, producto, presentación"></label><table><thead><tr><th>Producto</th><th>Presentación</th><th>Precio</th><th>Origen</th></tr></thead><tbody id="body"></tbody></table></main><script>
let items=[];const fmt=x=>new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(x);
function render(){const q=document.getElementById('q').value.toLocaleLowerCase('es');const body=document.getElementById('body');body.replaceChildren();for(const p of items.filter(x=>([x.brand,x.name,x.size].join(' ').toLocaleLowerCase('es').includes(q))).slice(0,300)){const tr=document.createElement('tr');for(const t of [[p.brand,p.name].filter(Boolean).join(' — '),p.size||'',fmt(p.price),p.managed?'Editado en D1':'Catálogo original']){const td=document.createElement('td');td.textContent=t;tr.appendChild(td)}body.appendChild(tr)}}
document.getElementById('q').addEventListener('input',render);fetch('/api/storefront-preview',{credentials:'same-origin'}).then(async r=>{const d=await r.json();if(!r.ok)throw Error(d.error||'Error de API');items=d.items;document.getElementById('status').textContent=`${d.stats.visible} productos visibles · ${d.stats.modified} con cambios en D1 · Los exclusivos de inventario no se publican automáticamente.`;render()}).catch(e=>{document.getElementById('status').textContent='Error: '+e.message});
</script></body></html>
