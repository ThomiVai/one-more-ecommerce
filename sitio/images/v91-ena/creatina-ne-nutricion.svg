<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650"><rect width="900" height="650" fill="white"/><g fill="#152018" font-family="Arial,sans-serif"><text x="45" y="65" font-size="26" font-weight="bold">ENA · Creatina · Neutro</text><text x="45" y="110" font-size="20">Información nutricional · Porción: 5 g</text><path d="M45 145H855 M45 205H855 M45 270H855" stroke="#999"/><text x="45" y="184" font-size="19">Componente</text><text x="610" y="184" font-size="19">Por porción</text><text x="45" y="247" font-size="22">Creatina monohidrato</text><text x="610" y="247" font-size="22">5 g</text><text x="45" y="325" font-size="20" font-weight="bold">Ingredientes</text><text x="45" y="365" font-size="18">Creatina monohidrato. Puede contener derivados de leche y soja.</text><text x="45" y="580" font-size="17">Ficha transcripta de la tabla oficial de ENA.</text><text x="45" y="610" font-size="17">Consultá el envase de tu producto para verificar la información.</text></g></svg>